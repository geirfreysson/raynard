name: Extension pull request

on:
  pull_request:
    paths:
      - "extensions/**"
      - "scripts/extension-catalog.test.mjs"
      - "scripts/plugin-tool-runner.mjs"
      - "scripts/plugin-sdk/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: extension-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate catalog contracts
        run: npx vitest run scripts/extension-catalog.test.mjs

      - name: Run deterministic tests
        run: npm test -- --run

      - name: Type-check and build renderer
        run: npm run build
