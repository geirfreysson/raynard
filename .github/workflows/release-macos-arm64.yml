name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build signed Apple Silicon DMG
    runs-on: macos-15
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      RAYNARD_RUNTIME_TARGET: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/validate-release-version.mjs "$RELEASE_TAG"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-arm64

      - name: Cache the pinned embedded Node runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/.standalone-runtime-cache
            scripts/standalone-runtime/node_modules
          key: standalone-runtime-macos-arm64-${{ hashFiles('scripts/standalone-runtime.mjs', 'scripts/standalone-runtime/package-lock.json') }}

      - name: Install application dependencies
        run: npm ci

      - name: Prepare standalone runtime
        run: npm run runtime:prepare:macos-arm64

      - name: Run deterministic tests
        run: |
          npm test -- --run
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate Apple release secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing CSC_LINK secret}"
          : "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD secret}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64 secret}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER secret}"

      - name: Import Developer ID certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/raynard-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | sed -E 's#^data:[^,]+,##' | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' | head -1)"
          test -n "$signing_identity"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Sign standalone runtime native code
        shell: bash
        run: |
          set -euo pipefail
          native_count=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" \
                "$candidate"
              codesign --verify --strict --verbose=2 "$candidate"
              native_count=$((native_count + 1))
            fi
          done < <(
            find src-tauri/runtime/agent-runtime -type f \
              \( -perm -111 -o -name '*.node' -o -name '*.dylib' \) \
              -print0
          )
          test "$native_count" -gt 0

      - name: Build, sign, notarize, and staple DMG
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles dmg --ci

      - name: Notarize and staple DMG container
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Verify standalone runtime and Apple trust
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_dir/Raynard.app"
          node scripts/verify-standalone-bundle.mjs macos "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          node_entitlements="$(codesign -d --entitlements - "$app_path/Contents/MacOS/node" 2>/dev/null)"
          if grep -q "get-task-allow" <<<"$node_entitlements"; then
            echo "Embedded Node still carries com.apple.security.get-task-allow; notarization would reject it." >&2
            exit 1
          fi
          grep -q "allow-jit" <<<"$node_entitlements"
          codesign -dv "$app_path/Contents/MacOS/node" 2>&1 | grep -q "flags=.*runtime"
          xcrun stapler validate "$dmg_path"
          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          source_dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          mkdir -p release-assets
          cp "$source_dmg" "release-assets/Raynard-${version}-mac-arm64.dmg"
          cp "$source_dmg" "release-assets/Raynard-mac-arm64.dmg"
          (
            cd release-assets
            shasum -a 256 "Raynard-${version}-mac-arm64.dmg" > "Raynard-${version}-mac-arm64.dmg.sha256"
            shasum -a 256 "Raynard-mac-arm64.dmg" > "Raynard-mac-arm64.dmg.sha256"
          )

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-assets/*
          if-no-files-found: error

  release-linux-x64:
    name: Build Linux x64 packages
    runs-on: ubuntu-22.04
    env:
      RAYNARD_RUNTIME_TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/validate-release-version.mjs "$RELEASE_TAG"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux-x64

      - name: Cache the pinned embedded Node runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/.standalone-runtime-cache
            scripts/standalone-runtime/node_modules
          key: standalone-runtime-linux-x64-${{ hashFiles('scripts/standalone-runtime.mjs', 'scripts/standalone-runtime/package-lock.json') }}

      - name: Install application dependencies
        run: npm ci

      - name: Prepare standalone runtime
        run: npm run runtime:prepare:linux-x64

      - name: Run deterministic tests
        run: |
          npm test -- --run
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build AppImage and Debian package
        env:
          # linuxdeploy and its appimage plugin ship as AppImages and mount
          # themselves with FUSE, which the runner image does not provide.
          # Extracting instead is the supported way to run them headlessly.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The embedded Node binary is already stripped upstream; letting
          # linuxdeploy strip it again only risks breaking a signed-upstream
          # executable.
          NO_STRIP: true
        run: npm run tauri:build -- --target x86_64-unknown-linux-gnu --bundles appimage,deb --ci

      - name: Verify Linux standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          node scripts/verify-standalone-bundle.mjs linux "$extract_dir/squashfs-root"

      - name: Stage Linux release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          source_appimage="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          source_deb="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$source_appimage"
          test -n "$source_deb"
          mkdir -p release-assets
          cp "$source_appimage" "release-assets/Raynard-${version}-linux-x86_64.AppImage"
          cp "$source_appimage" "release-assets/Raynard-linux-x86_64.AppImage"
          cp "$source_deb" "release-assets/Raynard-${version}-linux-amd64.deb"
          cp "$source_deb" "release-assets/Raynard-linux-amd64.deb"
          (
            cd release-assets
            sha256sum * > checksums.tmp
            while read -r checksum name; do
              printf '%s  %s\n' "$checksum" "$name" > "$name.sha256"
            done < checksums.tmp
            rm checksums.tmp
          )

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: release-assets/*
          if-no-files-found: error

  release-windows-x64:
    name: Build unsigned Windows x64 installer
    runs-on: windows-latest
    env:
      RAYNARD_RUNTIME_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/validate-release-version.mjs $env:RELEASE_TAG

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x64

      - name: Cache the pinned embedded Node runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/.standalone-runtime-cache
            scripts/standalone-runtime/node_modules
          key: standalone-runtime-windows-x64-${{ hashFiles('scripts/standalone-runtime.mjs', 'scripts/standalone-runtime/package-lock.json') }}

      - name: Install application dependencies
        run: npm ci

      - name: Prepare standalone runtime
        run: npm run runtime:prepare:windows-x64

      - name: Run deterministic tests
        run: |
          npm test -- --run
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Install and verify Windows standalone runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not produced.' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'raynard-bundle-verification'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS exited with code $($process.ExitCode)." }
          node scripts/verify-standalone-bundle.mjs windows $installDirectory

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $sourceInstaller = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $sourceInstaller) { throw 'The NSIS installer was not produced.' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $versionedName = "Raynard-$version-windows-x64-setup.exe"
          $stableName = 'Raynard-windows-x64-setup.exe'
          Copy-Item $sourceInstaller.FullName (Join-Path release-assets $versionedName)
          Copy-Item $sourceInstaller.FullName (Join-Path release-assets $stableName)
          foreach ($name in @($versionedName, $stableName)) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path release-assets $name)).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText((Join-Path release-assets "$name.sha256"), "$hash  $name`n")
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-macos-arm64
      - release-linux-x64
      - release-windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download native release assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Include terminal installers
        run: |
          cp docs/static/install.sh release-assets/install.sh
          cp docs/static/install.ps1 release-assets/install.ps1

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Raynard $GITHUB_REF_NAME" \
              --notes-file release-draft.md
          else
            gh release edit "$GITHUB_REF_NAME" \
              --title "Raynard $GITHUB_REF_NAME" \
              --notes-file release-draft.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
